<!doctype html>
<html lang="en-gb" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Impressum</title>
    <link rel="canonical" href="https://www.spacebowls.at/impressum" />
    <link rel="icon" href="/images/favicon.png" sizes="any" />
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/images/favicon.png" />
    <link rel="stylesheet" href="/assets/css/theme.css" />
    <link rel="stylesheet" href="/assets/css/custom.css" />
    <script src="/assets/js/uikit.min.js"></script>
    <script src="/assets/js/uikit-icons.min.js"></script>
    <script src="/assets/js/theme.js"></script>
    <script>
      window.yootheme ||= {};
      yootheme.theme = {
        i18n: {
          close: { label: "Close" },
          totop: { label: "Back to top" },
          marker: { label: "Open" },
          navbarToggleIcon: { label: "Open Menu" },
          paginationPrevious: { label: "Previous page" },
          paginationNext: { label: "Next Page" },
          searchIcon: { toggle: "Open Search", submit: "Submit Search" },
          slider: { next: "Next slide", previous: "Previous slide", slideX: "Slide %s", slideLabel: "%s of %s" },
          slideshow: { next: "Next slide", previous: "Previous slide", slideX: "Slide %s", slideLabel: "%s of %s" },
          lightboxPanel: { next: "Next slide", previous: "Previous slide", slideLabel: "%s of %s", close: "Close" },
        },
      };
    </script>
    <script src="/assets/js/form.js" defer></script>
  </head>
  <body>
    <div class="uk-hidden-visually uk-notification uk-notification-top-left uk-width-auto">
      <div class="uk-notification-message">
        <a href="#tm-main" class="uk-link-reset">Skip to main content</a>
      </div>
    </div>
    <div class="tm-page">
      <header class="tm-header">
        <div class="tm-headerbar-default tm-headerbar tm-headerbar-top">
          <div class="uk-container">
            <div class="uk-flex uk-flex-center">
              <div>
                <a href="/" aria-label="Back to home" class="uk-logo">
                  <img src="/images/spacebowls_header.svg" width="500" height="96" alt
                /></a>
              </div>
            </div>
            <div class="tm-headerbar-stacked uk-grid-medium uk-child-width-auto uk-flex-center uk-flex-middle" uk-grid>
              <div>
                <div class="uk-panel" id="module-tm-3">
                  <ul class="uk-grid uk-flex-inline uk-flex-middle uk-flex-nowrap uk-grid-small">
                    <li>
                      <a
                        href="https://www.facebook.com/profile.php?id=61553736406765"
                        class="uk-preserve-width uk-icon-button"
                        rel="noreferrer"
                        target="_blank"
                        ><span uk-icon="icon: facebook;"></span
                      ></a>
                    </li>
                    <li>
                      <a
                        href="https://www.instagram.com/spacebowls_vienna/"
                        class="uk-preserve-width uk-icon-button"
                        rel="noreferrer"
                        target="_blank"
                        ><span uk-icon="icon: instagram;"></span
                      ></a>
                    </li>
                    <li>
                      <a
                        href="https://www.google.com/maps/place/spacebowls+mutterschiff/@48.2004415,16.3565967,17z/data=!3m1!4b1!4m6!3m5!1s0x476d07f9a1120ced:0x87d532fd71cd6d9e!8m2!3d48.2004415!4d16.3591716!16s%2Fg%2F11kr9t1vsf?entry=ttu"
                        class="uk-preserve-width uk-icon-button"
                        rel="noreferrer"
                        target="_blank"
                        ><span uk-icon="icon: location;"></span
                      ></a>
                    </li>
                    <li>
                      <a
                        href="mailto:eat@spacebowls.at"
                        class="uk-preserve-width uk-icon-button"
                        rel="noreferrer"
                        target="_blank"
                        ><span uk-icon="icon: mail;"></span
                      ></a>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="uk-navbar-container">
          <div class="uk-container">
            <nav
              class="uk-navbar"
              uk-navbar='{"align":"left","container":".tm-header","boundary":".tm-header .uk-navbar-container"}'
            >
              <div class="uk-navbar-center"></div>
            </nav>
          </div>
        </div>
      </header>
      <main id="tm-main">
        <div class="uk-section-default uk-section">
          <div class="uk-container">
            <div class="uk-grid-margin uk-grid tm-grid-expand uk-child-width-1-1">
              <div class="uk-width-1-1">
                <h1>Impressum</h1>
                <div class="uk-panel uk-margin">
                  <p>Für den Inhalt verantwortlich:</p>
                  <p>
                    <span><strong>spacebowls GmbH</strong><br /></span>Schumanngasse 12/16<br />1180 Wien<br /><a
                      href="mailto:tom@spacebowls.at"
                      >tom@spacebowls.at</a
                    >
                  </p>
                  <p></p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
      <footer>
        <style class="uk-margin-remove-adjacent">
          #footer\#0 {
            animation: wobble 2s ease infinite;
          }
          @keyframes wobble {
            0%,
            100% {
              -webkit-transform: translateX(0%);
              transform: translateX(0%);
              -webkit-transform-origin: 50% 50%;
              transform-origin: 50% 50%;
            }
            15% {
              -webkit-transform: translateX(-32px) rotate(-10deg);
              transform: translateX(-32px) rotate(-10deg);
            }
            30% {
              -webkit-transform: translateX(calc(32px / 2)) rotate(10deg);
              transform: translateX(calc(32px / 2)) rotate(10deg);
            }
            45% {
              -webkit-transform: translateX(calc(-32px / 2)) rotate(calc(-10deg / 1.8));
              transform: translateX(calc(-32px / 2)) rotate(calc(-10deg / 1.8));
            }
            60% {
              -webkit-transform: translateX(calc(32px / 3.3)) rotate(calc(10deg / 3));
              transform: translateX(calc(32px / 3.3)) rotate(calc(10deg / 3));
            }
            75% {
              -webkit-transform: translateX(calc(-32px / 5.5)) rotate(calc(-10deg / 5));
              transform: translateX(calc(-32px / 5.5)) rotate(calc(-10deg / 5));
            }
          }
          #footer\#1 {
            position: relative;
            z-index: 1;
          }
        </style>
        <div
          class="uk-section-default uk-section uk-section-medium-top uk-padding-remove-bottom"
          uk-scrollspy="target: [uk-scrollspy-class]; cls: uk-animation-slide-bottom; delay: 400;"
        >
          <div class="uk-container">
            <div class="uk-grid-margin uk-grid tm-grid-expand uk-child-width-1-1">
              <div class="uk-width-1-1">
                <div
                  class="spacebowls_bunt uk-position-relative uk-margin uk-text-center"
                  id="footer#0"
                  style="z-index: 0"
                >
                  <img class="el-image" src="/images/Character.svg" alt loading="lazy" width="300" height="454" />
                </div>
              </div>
            </div>
          </div>
        </div>
        <div id="footer#1" class="uk-section-primary uk-section">
          <div class="uk-container uk-container-xsmall">
            <div class="uk-grid-margin uk-grid tm-grid-expand uk-child-width-1-1">
              <div class="uk-width-1-1">
                <form class="uk-margin js-contact-form" novalidate>
                  <div class="uk-grid-margin uk-grid tm-grid-expand uk-child-width-1-1">
                    <div class="uk-width-1-1">
                      <div class="uk-margin">
                        <div class="uk-flex-middle uk-grid-small uk-child-width-1-3@m" uk-grid>
                          <div class="el-item">
                            <div>
                              <label class="uk-form-label" for="name">Name <span>*</span></label>
                              <div class="uk-form-controls">
                                <input
                                  class="uk-input uk-form-width-large"
                                  id="name"
                                  type="text"
                                  name="name"
                                  required
                                />
                              </div>
                            </div>
                          </div>
                          <div class="el-item">
                            <div>
                              <label class="uk-form-label" for="email">E-Mail <span>*</span></label>
                              <div class="uk-form-controls">
                                <input
                                  class="uk-input uk-form-width-large"
                                  id="email"
                                  type="email"
                                  name="email"
                                  required
                                />
                              </div>
                            </div>
                          </div>
                          <div class="el-item">
                            <div>
                              <label class="uk-form-label" for="telefon">Telefon</label>
                              <div class="uk-form-controls">
                                <input class="uk-input uk-form-width-large" id="telefon" type="tel" name="telefon" />
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                      <div class="uk-margin">
                        <div>
                          <div class="uk-form-controls">
                            <textarea class="uk-textarea" id="nachricht" name="nachricht"></textarea>
                          </div>
                        </div>
                      </div>
                      <div class="uk-margin">
                        <button type="submit" class="el-content uk-inline uk-button uk-button-default">
                          <span class="ye-form--btn-content">Abschicken</span>
                          <span
                            uk-spinner="ratio: 0.5"
                            class="ye-form--btn-spinner uk-hidden uk-position-center"
                          ></span>
                        </button>
                      </div>
                    </div>
                  </div>
                  <input type="checkbox" name="botcheck" hidden tabindex="-1" autocomplete="off" />
                  <div data-form-errors></div>
                </form>
              </div>
            </div>
          </div>
        </div>
        <div class="uk-section-secondary uk-section">
          <div class="uk-container">
            <div class="uk-grid-margin uk-grid tm-grid-expand uk-child-width-1-1">
              <div class="uk-width-1-1">
                <div>
                  <ul class="uk-margin-remove-bottom uk-nav uk-nav-secondary">
                    <li class="el-item uk-active">
                      <a class="el-link" href="/impressum"> Impressum </a>
                    </li>
                    <li class="el-item">
                      <a class="el-link" href="/datenschutzerklaerung"> Datenschutzerklärung </a>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
